name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Mise en cache des dépendances 
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter ESLint
        run: npm run lint

      - name: Exécuter Vitest et générer le rapport JUnit
        run: |
          mkdir -p test-results
          npm run test -- --reporter=junit --outputFile=test-results/junit.xml

      - name: Archiver le rapport de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-tests
          path: test-results/junit.xml
          if-no-files-found: warn


  build:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Mise en cache des dépendances
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Archiver le build de production
        uses: actions/upload-artifact@v7
        with:
          name: build-production
          path: dist/
          if-no-files-found: error

      - name: Ajouter le résumé du pipeline
        run: |
          {
            printf '%s\n' '## Résumé du pipeline'
            printf '%s\n' '- Tests : Vitest (artefact `rapport-tests`)'
            printf '%s\n' '- Qualité : ESLint'
            printf '%s\n' '- Build : production (artefact `build-production`)'
          } >> "$GITHUB_STEP_SUMMARY"


